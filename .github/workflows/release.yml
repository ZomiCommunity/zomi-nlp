# .github/workflows/release.yml
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: List built files
        run: ls -la dist/

      - name: Detect release type
        id: prerelease
        run: |
          # Get the tag name (e.g., v0.2.0, v0.2.0a1, v0.2.0.dev1)
          TAG="${GITHUB_REF#refs/tags/}"
          
          # Check if this is a pre-release (contains a, b, rc, dev)
          if [[ "$TAG" =~ (a|b|rc|dev) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "target=testpypi" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRE-RELEASE -> TestPyPI"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "target=pypi" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRODUCTION RELEASE -> PyPI"
          fi

      - name: Upload to TestPyPI (pre-releases only)
        if: steps.prerelease.outputs.is_prerelease == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          twine upload dist/* \
            --repository-url https://test.pypi.org/legacy/ \
            --verbose

      - name: Upload to PyPI (production releases only)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* \
            --verbose

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/*.whl
            ./dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📦 RELEASE SUMMARY"
          echo "=========================================="
          echo "Release type: ${{ steps.prerelease.outputs.is_prerelease == 'true' && 'PRE-RELEASE' || 'PRODUCTION' }}"
          echo "Target: ${{ steps.prerelease.outputs.target }}"
          echo ""
          echo "Files:"
          ls -la ./dist/
          echo "=========================================="