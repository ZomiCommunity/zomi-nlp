# .github/workflows/release.yml
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: List built files
        run: ls -la dist/

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ [a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRE-RELEASE (will upload to TestPyPI)"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRODUCTION RELEASE (will upload to PyPI)"
          fi

      - name: Upload to TestPyPI (pre-releases)
        if: steps.prerelease.outputs.is_prerelease == 'true'
        run: |
          twine upload dist/* \
            --repository-url https://test.pypi.org/legacy/ \
            --username __token__ \
            --password ${{ secrets.TEST_PYPI_TOKEN }}
        continue-on-error: true

      - name: Upload to PyPI (production)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: |
          twine upload dist/* \
            --username __token__ \
            --password ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/*.whl
            ./dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Summary of build
        if: always()
        run: |
          echo "=========================================="
          echo "📦 RELEASE SUMMARY"
          echo "=========================================="
          echo "Release type: ${{ steps.prerelease.outputs.is_prerelease == 'true' && 'PRE-RELEASE' || 'PRODUCTION' }}"
          echo ""
          echo "Built files:"
          ls -la ./dist/
          echo "=========================================="