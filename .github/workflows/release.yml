# .github/workflows/release.yml
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: List built files
        run: ls -la dist/

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ [a-zA-Z] ]] || [[ "${{ github.event.inputs.version }}" =~ [a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRE-RELEASE"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ Detected as PRODUCTION RELEASE"
          fi

      - name: Upload to TestPyPI (pre-releases)
        if: steps.prerelease.outputs.is_prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ./dist
          attestations: true
          verbose: true

      - name: Upload to PyPI (production)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist
          attestations: true
          verbose: true

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/*.whl
            ./dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Summary of build
        if: always()
        run: |
          echo "=========================================="
          echo "📦 RELEASE SUMMARY"
          echo "=========================================="
          echo "Release type: ${{ steps.prerelease.outputs.is_prerelease == 'true' && 'PRE-RELEASE' || 'PRODUCTION' }}"
          echo ""
          echo "Files uploaded:"
          ls -la ./dist/
          echo "=========================================="