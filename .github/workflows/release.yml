name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build and inspect package
      id: build
      uses: hynek/build-and-inspect-python-package@v2

    - name: Debug build outputs
      run: |
        echo "sdist: '${{ steps.build.outputs.sdist }}'"
        echo "wheel: '${{ steps.build.outputs.wheel }}'"

    - name: Detect pre-release
      id: prerelease
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        if [[ "$TAG" =~ [a-zA-Z] ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Build package for upload
      run: |
        pip install build
        python -m build

    - name: Upload to TestPyPI
      if: steps.prerelease.outputs.is_prerelease == 'true'
      run: |
        pip install twine
        twine upload dist/* \
          ${{ steps.build.outputs.sdist }} \
          ${{ steps.build.outputs.wheel }} \
          --repository testpypi \
          --username __token__ \
          --password ${{ secrets.TEST_PYPI_TOKEN }} \
          --skip-existing
      continue-on-error: true

    - name: Upload to PyPI (Trusted Publishing)
      if: steps.prerelease.outputs.is_prerelease == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true

    - name: Upload artifacts + changelog to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        body_path: CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
